name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Smoke Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Smoke test
        run: |
          node dist/index.js > /tmp/mcp.out 2>&1 &
          PID=$!
          sleep 3
          if kill -0 $PID 2>/dev/null; then
            echo "[MongoDB MCP] Server started successfully (smoke test passed)"
            kill $PID 2>/dev/null || true
          else
            echo "Server exited prematurely. Output:"
            cat /tmp/mcp.out
            exit 1
          fi