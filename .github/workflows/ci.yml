name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Smoke Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Smoke test
        run: |
          set -e
          node dist/index.js 2> /tmp/mcp.out &
          PID=$!
          for i in $(seq 1 20); do
            if grep -q "MongoDB MCP server running on stdio" /tmp/mcp.out; then
              echo "[MongoDB MCP] Server started successfully (smoke test passed)"
              kill $PID 2>/dev/null || true
              wait $PID 2>/dev/null || true
              exit 0
            fi
            if ! kill -0 $PID 2>/dev/null; then
              break
            fi
            sleep 1
          done
          echo "Server failed to start. Output:"
          cat /tmp/mcp.out
          exit 1